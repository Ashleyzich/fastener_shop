{% extends 'base.html' %}

{% block title %}{% if customer %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        {% if customer %}
                            Edit Customer
                        {% else %}
                            Add New Customer
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name *</label>
                                <input type="text" name="name" class="form-control" value="{{ customer.name|default:'' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Customer Type</label>
                                <select name="customer_type" class="form-select">
                                    <option value="INDIVIDUAL" {% if customer.customer_type == 'INDIVIDUAL' %}selected{% endif %}>Individual</option>
                                    <option value="COMPANY" {% if customer.customer_type == 'COMPANY' %}selected{% endif %}>Company</option>
                                    <option value="CONTRACTOR" {% if customer.customer_type == 'CONTRACTOR' %}selected{% endif %}>Contractor</option>
                                    <option value="WALK_IN" {% if customer.customer_type == 'WALK_IN' %}selected{% endif %}>Walk-in</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Company Name</label>
                                <input type="text" name="company_name" class="form-control" value="{{ customer.company_name|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact Person</label>
                                <input type="text" name="contact_person" class="form-control" value="{{ customer.contact_person|default:'' }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" value="{{ customer.phone|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" value="{{ customer.email|default:'' }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea name="address" class="form-control" rows="3">{{ customer.address|default:'' }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Credit Limit</label>
                                <input type="number" name="credit_limit" class="form-control" step="0.01" value="{{ customer.credit_limit|default:'0' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Credit Terms</label>
                                <input type="text" name="credit_terms" class="form-control" placeholder="e.g., Net 30" value="{{ customer.credit_terms|default:'' }}">
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'customer_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                {% if customer %}
                                    Update Customer
                                {% else %}
                                    Create Customer
                                {% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
