{% extends 'base.html' %}

{% block title %}Add Item - {{ purchase.po_number }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Add Item to {{ purchase.po_number }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Product *</label>
                            <select name="product" class="form-select" required>
                                <option value="">Select Product...</option>
                                {% for product in products %}
                                <option value="{{ product.id }}">
                                    {{ product.name }} - {{ product.diameter }} {{ product.length }}
                                    (Current stock: {{ product.quantity }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Quantity *</label>
                            <input type="number" name="quantity" class="form-control" min="1" step="0.01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Unit Price *</label>
                            <input type="number" name="unit_price" class="form-control" min="0" step="0.01" required>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'purchase_detail' purchase.pk %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Add Item</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
